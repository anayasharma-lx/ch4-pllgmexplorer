<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Parallelogram Explorer — Ganita Prakash Grade 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0ede8;--border:#d8d4cc;
  --text:#1a1814;--text2:#5a5650;--text3:#9a958e;
  --blue:#2c5f9e;--red:#c0392b;--green:#1a7a4a;--orange:#e08020;
  --font:'DM Sans',-apple-system,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
.page{max-width:860px;margin:0 auto;padding:28px 20px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.title{font-size:22px;font-weight:700;margin-bottom:5px}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:22px;max-width:560px;line-height:1.5}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px}
.sl-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sl-row label{font-size:13px;font-weight:500;color:var(--text2);min-width:160px}
.sl-row input[type=range]{flex:1;height:5px;cursor:pointer}
.sl-val{font-family:var(--mono);font-size:15px;font-weight:700;min-width:48px;text-align:right}
.layout{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
@media(max-width:600px){.layout{grid-template-columns:1fr}}
canvas{display:block;width:100%;border-radius:10px;border:1.5px solid var(--border);background:#fafaf8}
.stats-panel{display:flex;flex-direction:column;gap:10px}
.stat{background:var(--surface2);border:1.5px solid var(--border);border-radius:9px;padding:11px 14px}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:17px;font-weight:700}
.angle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.angle-cell{border-radius:8px;padding:9px 12px;text-align:center;border:1.5px solid}
.angle-cell-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:3px}
.angle-cell-val{font-family:var(--mono);font-size:18px;font-weight:700}
.rule-strip{background:#fff8f0;border:1.5px solid #f0d8c0;border-radius:9px;padding:11px 14px;font-size:13px;color:#6b4400;line-height:1.65}
.rule-strip strong{color:#a05000}
.rule-strip .eq{font-family:var(--mono);font-size:12.5px;display:block;margin:2px 0}
</style>
</head>
<body>
<div class="page">
  <div class="lbl">Chapter 4 · Quadrilaterals</div>
  <div class="title">Parallelogram Explorer</div>
  <div class="subtitle">Drag the angle and side lengths. Watch how the parallel marks, equal sides, bisecting diagonals, and co-interior angles all update together — proving every property.</div>

  <div class="card">
    <div class="sl-row">
      <label>Angle A (°)</label>
      <input type="range" id="angA" min="20" max="160" value="60" style="accent-color:var(--orange)" oninput="render()">
      <span class="sl-val" style="color:var(--orange)" id="angAv">60°</span>
    </div>
    <div class="sl-row">
      <label>Side AB length</label>
      <input type="range" id="ab" min="80" max="200" value="160" style="accent-color:var(--blue)" oninput="render()">
      <span class="sl-val" style="color:var(--blue)" id="abv">160</span>
    </div>
    <div class="sl-row">
      <label>Side AD length</label>
      <input type="range" id="ad" min="50" max="140" value="90" style="accent-color:var(--red)" oninput="render()">
      <span class="sl-val" style="color:var(--red)" id="adv">90</span>
    </div>
  </div>

  <div class="layout">
    <canvas id="cvs" height="320"></canvas>
    <div class="stats-panel">
      <div class="stat">
        <div class="stat-label">All four angles</div>
        <div class="angle-grid" id="angleGrid"></div>
      </div>
      <div class="stat">
        <div class="stat-label">Diagonal intersection</div>
        <div class="stat-val" id="diagStat">midpoint of both</div>
      </div>
      <div class="stat">
        <div class="stat-label">Sides</div>
        <div class="stat-val" id="sideStat"></div>
      </div>
      <div class="rule-strip" id="ruleStrip"></div>
    </div>
  </div>
</div>

<script>
function render(){
  const angA=parseInt(document.getElementById('angA').value);
  const ab=parseInt(document.getElementById('ab').value);
  const ad=parseInt(document.getElementById('ad').value);
  document.getElementById('angAv').textContent=angA+'°';
  document.getElementById('abv').textContent=ab;
  document.getElementById('adv').textContent=ad;

  const angB=180-angA, angC=angA, angD=angB;

  // Angle grid
  const cols=['#e08020','#2c5f9e','#e08020','#c0392b'];
  const labels=['∠A','∠B','∠C','∠D'];
  const vals=[angA,angB,angC,angD];
  const grid=document.getElementById('angleGrid');
  grid.innerHTML='';
  labels.forEach((lbl,i)=>{
    const cell=document.createElement('div');
    cell.className='angle-cell';
    cell.style.borderColor=cols[i]+'55';
    cell.style.background=cols[i]+'0d';
    cell.innerHTML=`<div class="angle-cell-lbl" style="color:${cols[i]}">${lbl}</div><div class="angle-cell-val" style="color:${cols[i]}">${vals[i]}°</div>`;
    grid.appendChild(cell);
  });

  document.getElementById('sideStat').innerHTML=`AB = CD = ${ab}\nAD = BC = ${ad}`;
  document.getElementById('ruleStrip').innerHTML=`<strong>Parallelogram rules:</strong>
    <span class="eq">∠A + ∠B = ${angA}+${angB} = 180° ✓</span>
    <span class="eq">∠A = ∠C = ${angA}° ✓ (opposite)</span>
    <span class="eq">∠B = ∠D = ${angB}° ✓ (opposite)</span>
    Diagonals bisect each other at their midpoints.`;

  drawPara(angA, ab, ad);
}

function drawPara(angA, ab, ad){
  const cvs=document.getElementById('cvs');
  const PR=window.devicePixelRatio||1;
  const W=cvs.parentElement.clientWidth;
  cvs.width=W*PR; cvs.height=320*PR;
  cvs.style.width=W+'px'; cvs.style.height='320px';
  const ctx=cvs.getContext('2d');
  ctx.scale(PR,PR);
  ctx.fillStyle='#fafaf8'; ctx.fillRect(0,0,W,320);

  const angR=angA*Math.PI/180;
  // Place A at center-ish
  const A={x:W/2-ab/2, y:200};
  const B={x:A.x+ab, y:A.y};
  const D={x:A.x+ad*Math.cos(angR), y:A.y-ad*Math.sin(angR)};
  const C={x:B.x+ad*Math.cos(angR), y:B.y-ad*Math.sin(angR)};
  const O={x:(A.x+C.x)/2, y:(A.y+C.y)/2};

  // Draw diagonals
  ctx.setLineDash([5,4]); ctx.strokeStyle='#c0b8a8'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(C.x,C.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(D.x,D.y); ctx.stroke();
  ctx.setLineDash([]);

  // Midpoint dot
  ctx.beginPath(); ctx.fillStyle='#9a958e'; ctx.arc(O.x,O.y,5,0,Math.PI*2); ctx.fill();
  ctx.font='11px DM Sans'; ctx.fillStyle='#9a958e'; ctx.textAlign='left';
  ctx.fillText('O (midpoint)', O.x+8, O.y+4);

  // Draw shape
  ctx.beginPath();
  ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.lineTo(C.x,C.y); ctx.lineTo(D.x,D.y);
  ctx.closePath();
  ctx.fillStyle='rgba(224,128,32,.08)'; ctx.fill();
  ctx.strokeStyle='#e08020'; ctx.lineWidth=2.5; ctx.stroke();

  // Parallel marks on AB,DC (double) and AD,BC (single)
  drawParallelMark(ctx, A, B, '#2c5f9e', 2);
  drawParallelMark(ctx, D, C, '#2c5f9e', 2);
  drawParallelMark(ctx, A, D, '#c0392b', 1);
  drawParallelMark(ctx, B, C, '#c0392b', 1);

  // Equal length ticks
  drawTick(ctx, A.x,A.y,B.x,B.y,'#2c5f9e', 2);
  drawTick(ctx, D.x,D.y,C.x,C.y,'#2c5f9e', 2);
  drawTick(ctx, A.x,A.y,D.x,D.y,'#c0392b', 1);
  drawTick(ctx, B.x,B.y,C.x,C.y,'#c0392b', 1);

  // Vertex labels and angle arcs
  const verts=[A,B,C,D];
  const lbls=['A','B','C','D'];
  const angColors=['#e08020','#2c5f9e','#e08020','#c0392b'];
  const angles_deg=[angA,180-angA,angA,180-angA];
  const prevIdxs=[3,0,1,2], nextIdxs=[1,2,3,0];

  verts.forEach((v,i)=>{
    const prev=verts[prevIdxs[i]], next=verts[nextIdxs[i]];
    const a1=Math.atan2(prev.y-v.y,prev.x-v.x);
    const a2=Math.atan2(next.y-v.y,next.x-v.x);
    ctx.beginPath(); ctx.strokeStyle=angColors[i]; ctx.lineWidth=1.5;
    ctx.arc(v.x,v.y,20, Math.min(a1,a2), Math.max(a1,a2));
    ctx.stroke();
    const mid=(a1+a2)/2;
    ctx.font='bold 11px DM Mono'; ctx.fillStyle=angColors[i]; ctx.textAlign='center';
    ctx.fillText(angles_deg[i]+'°', v.x+36*Math.cos(mid), v.y+36*Math.sin(mid));
    // Vertex dot
    ctx.beginPath(); ctx.fillStyle='#1a1814'; ctx.arc(v.x,v.y,5,0,Math.PI*2); ctx.fill();
    // Vertex label
    const offX=v.x<W/2?-14:14, offY=v.y>200?16:-14;
    ctx.font='bold 13px DM Sans'; ctx.fillStyle='#1a1814';
    ctx.fillText(lbls[i], v.x+offX, v.y+offY);
  });
}

function drawTick(ctx,x1,y1,x2,y2,color,n){
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
  const nx=-dy/len*6, ny=dx/len*6;
  const spacing=5;
  for(let k=0;k<n;k++){
    const off=(k-(n-1)/2)*spacing;
    const tx=mx+dx/len*off, ty=my+dy/len*off;
    ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2;
    ctx.moveTo(tx-nx,ty-ny); ctx.lineTo(tx+nx,ty+ny); ctx.stroke();
  }
}

function drawParallelMark(ctx,p1,p2,color,n){
  const mx=(p1.x+p2.x)/2+3, my=(p1.y+p2.y)/2;
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.sqrt(dx*dx+dy*dy);
  const ux=dx/len, uy=dy/len;
  const nx=-uy*6, ny=ux*6;
  for(let k=0;k<n;k++){
    const off=(k-(n-1)/2)*5;
    const tx=mx+ux*off, ty=my+uy*off;
    ctx.beginPath(); ctx.strokeStyle=color+'99'; ctx.lineWidth=1.5;
    ctx.moveTo(tx-nx-nx*0.3+ux*4,ty-ny-ny*0.3+uy*4);
    ctx.lineTo(tx+nx+nx*0.3-ux*4,ty+ny+ny*0.3-uy*4);
    ctx.stroke();
  }
}

window.addEventListener('resize',render);
render();
</script>
</body>
</html>
